<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator</title>
  <style>
    body {
      background-color: black;
      color: white;
      margin-top: 3em;
    }

    .number {
      font-size: 50px;
      font-family: Arial;
      justify-self: center;
      margin-bottom: 30px;
      position: absolute;
      top: -15px;
      right: 30px;
    }

    main {
      width: 20rem;
      height: 25rem;
      border: 3px solid white;
      border-top-right-radius: 40px;
      border-top-left-radius: 40px;
      padding-top: 100px;
      padding-bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, 60px);
      grid-template-rows: repeat(4, 60px);
      grid-auto-rows: 60px;
      place-self: center;
      place-content: center;
      gap: 15px;
      position: relative;
    }

    .grey-button {
      background-color: rgb(51, 51, 51);
      border-radius: 50%;
      border: 0;
      color: white;
      font-size: 30px;
    }

    .operators {
      background-color: orange;
      border-radius: 50%;
      font-size: 30px;
      color: white;
      border: none;
    }

    .clear-button {
      font-size: 17px;
    }

    .iphone-button {
      width: 20rem;
      height: 5rem;
      border: 3px solid white;
      border-bottom-left-radius: 50px;
      border-bottom-right-radius: 50px;
      position: absolute;
      bottom: -5.40em;
      left: -3px;
      display: grid;
      place-content: center;
    }

    .circle {
      border: 3px solid white;
      border-radius: 50%;
      width: 3em;
      height: 3em;
    }

  </style>
</head>
<body>

  <main>
    <p class="number"></p>

    <button class="grey-button" onclick="
    updateCalculation('1')
    ">1</button>

    <button  class="grey-button" onclick="
     updateCalculation('2')
    ">2</button>

    <button  class="grey-button" onclick="
     updateCalculation('3')
    ">3</button>

    <button class="operators" onclick="
    updateCalculation('+')
    ">+</button>

    <button  class="grey-button" onclick="
     updateCalculation('4')
    ">4</button>

    <button  class="grey-button" onclick="
     updateCalculation('5')
    ">5</button>

    <button  class="grey-button" onclick="
     updateCalculation('6')
    ">6</button>

    <button class="operators" onclick="
    updateCalculation('-')
    ">-</button>

    <button  class="grey-button" class="grey button" onclick="
     updateCalculation('7')
    ">7</button>

    <button  class="grey-button" onclick="
     updateCalculation('8')
    ">8</button>

    <button  class="grey-button" onclick="
     updateCalculation('9')
    ">9</button>

    <button class="operators" onclick="
    updateCalculation('*')
    ">*</button>

    <button  class="grey-button" onclick="
     updateCalculation('0')
    ">0</button>

    <button  class="grey-button" onclick="
    updateCalculation('.')
    ">.</button>

    <button  class="grey-button" onclick="
      calculation = eval(calculation);

      displayCalculation();

      localStorage.setItem('calculation', calculation);
    ">=</button>

    <button class="operators" onclick="
    updateCalculation('/')
    ">/</button>

    <button  class="grey-button clear-button" onclick="
    calculation = '';

    displayCalculation();

    localStorage.setItem('calculation', calculation);
    ">Clear</button>

    <div class="iphone-button">
      <div class="circle"></div>
    </div>
  </main>


  <script>

  let calculation = localStorage.getItem('calculation') || '';

  displayCalculation();

  function updateCalculation(value) {
    calculation += value;

    // Display the calculation on the page
    displayCalculation();

    localStorage.setItem('calculation', calculation);
  }

  function displayCalculation() {
    document.querySelector('.number')
      .innerHTML = calculation;
  }

  </script>
</body>
</html>
